destaque: 99% de aproveitamento do terreno
copy: >-
  Terreno de 2.993 m² na Av. dos Vinhedos, em Zona Mista e Setor de Vias Especiais, no eixo
  residencial de alto padrão da Morada da Colina. O estudo de implantação chega a 2.967 m² de ABL,
  praticamente a área do terreno, com estacionamento no térreo e na cobertura.


  No térreo, três âncoras de 250 a 450 m², cinco lojas de 42 a 232 m² e restaurante com frente para
  a avenida. No primeiro pavimento, uma academia de 1.350 m² como âncora de fluxo recorrente, mais
  uma loja de 137 m².
ancoras: Academia, restaurante e três âncoras de 250 a 450 m²
papelNexa: >-
  Estudo de vocação, estudo de massa e viabilidade, estruturação do negócio e seleção das
  operações antes da obra.
