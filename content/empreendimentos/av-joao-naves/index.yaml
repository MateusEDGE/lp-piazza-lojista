resumoCard: >-
  Strip mall em desenvolvimento na Av. João Naves de Ávila, na rota do Center Shopping e da
  Universidade Federal, com 4.500 m² de ABL e 206 mil passantes por semana.
destaque: 206 mil passantes por semana na porta
copy: >-
  Terreno de 6.000 m² na Av. João Naves de Ávila, uma das vias de maior exposição contínua de
  Uberlândia, na rota principal para o Center Shopping e a Universidade Federal. O estudo de massa
  prevê 4.503 m² de ABL em dois pavimentos, com 140 vagas de estacionamento no térreo.


  A área de influência cresce 2% ao ano, tem 40% da população entre 25 e 49 anos e renda média
  domiciliar projetada em R$ 8.573 para 2026. A vocação apontada pelo estudo é a de operações que
  unem agilidade, conveniência e serviços essenciais: varejo express e supermercado de
  proximidade, fast-food e restaurantes, e um hub de saúde, bem-estar e conveniência.
ancoras: Supermercado de proximidade, academia e farmácia de rede
papelNexa: >-
  Estudo de vocação e da área de influência, estudo de massa e viabilidade, estruturação do
  negócio e seleção das operações antes da obra.
