destaque: 97% de aproveitamento, com 112 vagas em subsolo
copy: >-
  Terreno de 2.496 m² na Rua da Carioca, em Setor de Vias Secundárias, com acesso de veículos e
  de serviço pela Rua Moreira de Oliveira. O estudo de massa chega a 2.447 m² de ABL, 97% da área
  do terreno, com 112 vagas de estacionamento, 95 delas em subsolo.


  No térreo, uma praça reúne farmácia de 366 m², restaurante de 204 m², uma loja de 184 m² e seis
  lojas de 60 m². No primeiro pavimento, uma academia de 1.332 m² ancora o fluxo recorrente do
  conjunto.
