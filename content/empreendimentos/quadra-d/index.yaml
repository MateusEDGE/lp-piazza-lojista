resumoCard: >-
  Quadra inteira de 19.784 m² no bairro planejado Granja Marileusa, ao lado da Praça das Águas e
  do Villa Viseu, com sete lotes de fachada ativa em torno de uma praça central aberta.
destaque: Centro de quadra público com fachadas ativas e torres em sete lotes
copy: >-
  Quadra de 19.784 m² no bairro planejado Granja Marileusa, em Uberlândia, entre a Av. Maria Silva,
  a Av. Floriano Peixoto e a Rua Lapa do Lobo, em continuidade visual com a Praça das Águas e
  vizinha ao Villa Viseu. O masterplan fraciona a quadra em sete lotes, todos com térreo comercial,
  embasamento de 14 m e torres escalonadas, ligados por um centro de quadra aberto ao público.


  O miolo vence 4,5 m de desnível entre a avenida e a rua com rampas, escadarias e platôs
  gramados, cercados por comércio e serviço de fachada ativa. Um design code define ruas internas,
  transparência mínima das fachadas, marquises contínuas e terraços de uso público sobre o
  embasamento, para bares, restaurantes e convivência.
ancoras: Gastronomia, serviços e convivência
papelNexa: >-
  Masterplan da quadra com o .a Arquitetos Associados, fracionamento dos lotes, design code das
  fachadas e do centro de quadra e estruturação do negócio para os incorporadores de cada lote.
