destaque: 4 lojas de rua na base de uma torre residencial
copy: >-
  Terreno de 2.053 m² na Francisco Galassi, 1.428, na Morada da Colina, um dos eixos residenciais
  de maior renda de Uberlândia. O projeto combina uma torre residencial com quatro lojas no
  pavimento térreo, de 61, 82, 83 e 97 m², e 11 vagas de estacionamento.


  As lojas nascem com frente para a rua e com o público cativo da própria torre, o que favorece
  operações de recorrência diária: clínica, farmácia, café e restaurante. Estudo preliminar de
  fachada, sujeito a alterações.
