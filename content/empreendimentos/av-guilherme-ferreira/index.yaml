copy: >-
  Terreno de 4.292 m² na Av. Guilherme Ferreira, em Uberaba, com 64 metros de frente. O estudo de
  massa prevê 3.095 m² de ABL em dois pavimentos e 78 vagas de estacionamento, aproveitando 72% do
  terreno.


  No térreo, farmácia de 440 m² e pet shop de 400 m² ancoram dez lojas de 82 a 95 m². No primeiro
  pavimento, uma academia de 1.206 m² e mais duas lojas de 88 m² completam o mix de conveniência e
  serviços para a região.
