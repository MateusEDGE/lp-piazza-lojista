resumoCard: >-
  Strip mall em terreno de esquina na Av. Monsenhor Eduardo, zona leste de Uberlândia, com
  5.180 m² de ABL, 115 mil passantes por semana e baixa concorrência de grandes redes.
destaque: 115 mil passantes por semana e mercado ainda inexplorado
copy: >-
  Terreno de esquina de 6.710 m² na Av. Monsenhor Eduardo, 2.005, no bairro Santa Rosa, com duplo
  acesso pela avenida e pela Rua São Domingues. A via é o funil entre a malha urbana e o eixo da
  BR-365, com 115 mil passantes por semana e uma malha residencial consolidada onde 80% da
  população diurna é economicamente ativa.


  O estudo prevê 5.181 m² de ABL em dois pavimentos: no térreo, 22 lojas satélites de 50 a 75 m²,
  quatro âncoras de 302 a 400 m² e uma unidade para agência bancária; no primeiro, academia de
  1.009 m² e uma âncora de 900 m². A renda média da região cresce 9,27% ao ano e a ausência de
  grandes redes no entorno imediato garante liderança de mercado para as marcas pioneiras. O
  cronograma previsto vai da estruturação à ocupação plena em 26 meses.
ancoras: Academia de rede, drive-thru de alimentação rápida e farmácia de rede
papelNexa: >-
  Estudo de vocação e da área de influência, estudo de massa e viabilidade, estruturação da SCP,
  assinatura das âncoras, gestão de obra e comercialização das lojas satélites.
