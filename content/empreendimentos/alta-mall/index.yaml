resumoCard: >-
  Dez lojas de 95 m² em dois pavimentos, num terreno de esquina na Rua Tobias Barreto, com
  gastronomia, varejo e serviços de bairro.
destaque: 10 lojas de 95 m² em terreno de esquina
copy: >-
  Terreno de esquina de 2.002 m² (44 x 45,5 m) na Rua Tobias Barreto com a Av. Augusto dos Anjos.
  O projeto, em dois pavimentos, tem dez lojas de cerca de 95 m² no térreo, com fachada de vidro,
  marquises e terraço comum descoberto, e 15 vagas de estacionamento dentro do lote.


  Os renders mostram a vocação do conjunto: restaurantes, cervejaria e cafeteria numa praça de
  mesas ao ar livre, com varejo, fitness e serviços completando o mix. Projeto arquitetônico de
  julho de 2026, com 2.994 m² de área construída.
