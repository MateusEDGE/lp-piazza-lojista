resumoCard: >-
  Strip mall em desenvolvimento na esquina da Av. Maranhão com a Av. Santa Beatriz da Silva, em
  Uberaba, com 4.700 m² de ABL, supermercado, farmácia e academia como âncoras e 102 vagas.
destaque: Supermercado, farmácia e academia como âncoras
copy: >-
  Terreno de 6.733 m² na esquina da Av. Maranhão com a Av. Santa Beatriz da Silva, eixo comercial
  de Uberaba com acesso nos dois sentidos, do shopping e do aeroporto, e retorno pela própria
  Av. Maranhão. O estudo de massa prevê 4.725 m² de ABL em dois pavimentos e 102 vagas de
  estacionamento no térreo.


  No térreo, supermercado de 1.360 m², farmácia de 370 m², restaurante e nove lojas de 75 a 98 m².
  No primeiro pavimento, academia de 1.360 m² e três lojas de 201 a 495 m² completam um mix de
  abastecimento, saúde e conveniência para a região.
